<!DOCTYPE html>
<html>
<head>
  <title>AQI Chatbot</title>
  <style>
    body { font-family: Arial; background: #f4f4f4; }
    .box { width: 420px; margin: 50px auto; background: white; padding: 20px; border-radius: 10px; }
    .msg { margin: 6px 0; white-space: pre-line; }
    .user { color: blue; }
    .bot { color: green; }
    input, button { width: 100%; padding: 10px; margin-top: 5px; }
  </style>
</head>

<body>
<div class="box">
  <h2>AQI Chatbot</h2>
  <div id="chat"></div>
  <input id="inp" placeholder="Type here..." disabled />
  <button onclick="send()">Send</button>
</div>

<script>
const chat = document.getElementById("chat");
const inp = document.getElementById("inp");

let step = "start";
let lat = null, lon = null;

function add(text, cls) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.innerText = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}

function send() {
  if (step === "start") return;

  const msg = inp.value.trim();
  if (!msg) return;

  add("You: " + msg, "user");
  inp.value = "";
  inp.disabled = true;

  fetch("http://localhost:5001/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ message: msg, step, lat, lon })
  })
  .then(r => r.json())
  .then(d => {
    add("Bot: " + d.reply, "bot");
    step = d.nextStep;
    inp.disabled = false;
    inp.focus();
  });
}

/* ===== LOCATION FIRST, BOT STARTS AFTER ===== */

navigator.geolocation.getCurrentPosition(pos => {
  lat = pos.coords.latitude;
  lon = pos.coords.longitude;

  add("Location detected automatically.", "bot");

  fetch("http://localhost:5001/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ step: "start", lat, lon })
  })
  .then(r => r.json())
  .then(d => {
    add("Bot: " + d.reply, "bot");
    step = d.nextStep;
    inp.disabled = false;
    inp.focus();
  });
});
</script>
</body>
</html>
